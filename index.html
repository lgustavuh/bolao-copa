<style>
  html, body { background: #0a0a0a; margin: 0; }
  body { font-family: 'Manrope', system-ui, sans-serif; color: #fafafa; }
  ::selection { background: #fbbf24; color: #0a0a0a; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: #0a0a0a; }
  ::-webkit-scrollbar-thumb { background: #262626; border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: #404040; }
  .initial-loader {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #0a0a0a; color: #737373; font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; z-index: 9999;
  }
  .initial-loader::before {
    content: ''; display: inline-block; width: 8px; height: 8px; background: #fbbf24;
    border-radius: 50%; margin-right: 14px; animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.3); }
  }
  /* Some Tailwind classes for fonts (Tailwind play CDN inferes) */
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button {
    -webkit-appearance: none; margin: 0;
  }
  input[type=number] { -moz-appearance: textfield; }
</style>
